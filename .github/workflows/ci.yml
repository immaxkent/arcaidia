name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test:global
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run each stage as its own step rather than one composite command.
      # A failing step name is then visible from the API and the run summary
      # without downloading logs, which needs repository admin rights.
      - name: Build contracts
        run: pnpm contracts:build

      - name: ABI barrel is current
        run: pnpm abi:check

      - name: Subgraph manifests are current
        run: pnpm subgraph:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm test:shared-domain

      - name: Agent tests
        run: pnpm test:agent

      - name: Settlement tests
        run: pnpm test:settlement

      - name: Contract tests — Ethereum as source
        run: pnpm test:sc-eth

      - name: Contract tests — Arc as source
        run: pnpm test:sc-arc

      # Captured to a file so the failure can be re-emitted as annotations
      # below. Downloading run logs needs repository admin rights, which makes a
      # red build opaque to contributors; annotations are readable by anyone.
      - name: Golden end-to-end run
        id: e2e
        run: pnpm test:e2e 2>&1 | tee e2e.log
        shell: bash

      - name: Surface the end-to-end failure
        if: failure() && steps.e2e.outcome == 'failure'
        shell: bash
        run: |
          echo "::group::end-to-end output (tail)"
          tail -n 120 e2e.log || true
          echo "::endgroup::"
          # Re-emit the meaningful lines as annotations, which appear on the run
          # summary and in the public checks API.
          grep -E "Error|error|FAIL|✗|×|AssertionError|anvil said|did not become ready|exited with code" e2e.log \
            | tail -n 25 \
            | while IFS= read -r line; do
                printf '::error::%s\n' "${line//$'\r'/}"
              done

      - name: Contract sizes
        run: cd contracts && forge build --sizes
