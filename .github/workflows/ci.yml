name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test:global
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run each stage as its own step rather than one composite command.
      # A failing step name is then visible from the API and the run summary
      # without downloading logs, which needs repository admin rights.
      - name: Build contracts
        run: pnpm contracts:build

      - name: ABI barrel is current
        run: pnpm abi:check

      - name: Subgraph manifests are current
        run: pnpm subgraph:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm test:shared-domain

      - name: Agent tests
        run: pnpm test:agent

      - name: Settlement tests
        run: pnpm test:settlement

      - name: Contract tests — Ethereum as source
        run: pnpm test:sc-eth

      - name: Contract tests — Arc as source
        run: pnpm test:sc-arc

      - name: Golden end-to-end run
        run: pnpm test:e2e

      - name: Contract sizes
        run: cd contracts && forge build --sizes
