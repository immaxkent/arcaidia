# The always-on operations stack (WP-31/WP-32): everything that has to be running for the
# market to work and be watched — reverse proxy, telemetry relay, the House solver, the
# settlement worker, and (opt-in) the two independent operators and the load generator.
#
#   OPS_HOST=203.0.113.7.sslip.io docker compose -f docker-compose.ops.yml up -d --build
#   docker compose -f docker-compose.ops.yml --profile operators --profile loadgen up -d --build
#
# Config is env files, never baked into images: .env (House solver + worker + relay),
# .env.solver-b / .env.solver-c (operators), .env.loadgen (load generator). See deploy/README.md.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      OPS_HOST: ${OPS_HOST:?set OPS_HOST to this box's public hostname, e.g. 203.0.113.7.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay
      - house-solver
      - x402-gateway

  relay:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: packages/relay/src/entrypoint/main.ts
    restart: unless-stopped
    env_file: [.env]
    environment:
      RELAY_PORT: '8090'
    expose: ['8090']

  x402-gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: packages/x402-gateway/src/entrypoint/main.ts
    restart: unless-stopped
    env_file: [.env]
    environment:
      X402_GATEWAY_PORT: '8402'
      # Paid requests are forwarded to the relay over the compose network.
      INTELLIGENCE_UPSTREAM: http://relay:8090
    expose: ['8402']
    depends_on: [relay]

  house-solver:
    build:
      context: .
      dockerfile: packages/agent/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      SOLVER_QUOTE_PORT: '8787'
      # Inside the compose network the relay is reachable by service name, not by public URL.
      ARCAIDIA_TELEMETRY_URL: http://relay:8090
      TELEMETRY_ENABLED: 'true'
      SOLVER_DECISION_LOG_PATH: /tmp/solver-decisions.jsonl
      # WP-35: the House solver buys its market view through the paywall (HEDERA_* from .env).
      # Needs X402_PAY_TO in .env to be a different account from HEDERA_ACCOUNT_ID; until then set
      # HOUSE_INTELLIGENCE_URL=http://relay:8090 in .env to read the same view free.
      INTELLIGENCE_URL: ${HOUSE_INTELLIGENCE_URL:-http://x402-gateway:8402}
    expose: ['8787']
    depends_on: [relay, x402-gateway]

  settlement:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: packages/settlement/src/entrypoint/main.ts
    restart: unless-stopped
    env_file: [.env]

  solver-b:
    profiles: [operators]
    build:
      context: .
      dockerfile: packages/agent/Dockerfile
    restart: unless-stopped
    env_file: [.env.solver-b]
    environment:
      SOLVER_QUOTE_PORT: '8787'
      ARCAIDIA_TELEMETRY_URL: http://relay:8090
      TELEMETRY_ENABLED: 'true'
      SOLVER_DECISION_LOG_PATH: /tmp/solver-decisions.jsonl
    depends_on: [relay]

  solver-c:
    profiles: [operators]
    build:
      context: .
      dockerfile: packages/agent/Dockerfile
    restart: unless-stopped
    env_file: [.env.solver-c]
    environment:
      SOLVER_QUOTE_PORT: '8787'
      ARCAIDIA_TELEMETRY_URL: http://relay:8090
      TELEMETRY_ENABLED: 'true'
      SOLVER_DECISION_LOG_PATH: /tmp/solver-decisions.jsonl
    depends_on: [relay]

  loadgen:
    profiles: [loadgen]
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: packages/loadgen/src/entrypoint/main.ts
    restart: unless-stopped
    env_file: [.env.loadgen]
    environment:
      LOADGEN_JOURNAL_PATH: /tmp/loadgen.jsonl
      LOADGEN_METRICS_PATH: /tmp/loadgen.metrics.json
    volumes:
      - ./loadgen.config.json:/app/loadgen.config.json:ro

volumes:
  caddy-data:
  caddy-config:
