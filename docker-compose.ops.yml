# The always-on operations stack (WP-31/WP-32): everything that has to be running for the
# market to work and be watched — reverse proxy, telemetry relay, the House solver, the
# settlement worker, and (opt-in) the two independent operators and the load generator.
#
#   OPS_HOST=203.0.113.7.sslip.io docker compose -f docker-compose.ops.yml up -d --build
#   docker compose -f docker-compose.ops.yml --profile operators --profile loadgen up -d --build
#
# Config is env files, never baked into images: .env (House solver + worker + relay),
# .env.solver-b / .env.solver-c (operators), .env.loadgen (load generator). See deploy/README.md.
#
# One image for every Node service (`arcaidia-service`, deploy/Dockerfile.service): the same
# workspace, the entrypoint chosen per container by SERVICE. Built once, by `relay`; every other
# service reuses it. Seven separate builds of the same tree used to take a 2 GB box an hour of
# swapping and filled its disk with build cache.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      OPS_HOST: ${OPS_HOST:?set OPS_HOST to this box's public hostname, e.g. 203.0.113.7.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay
      - house-solver
      - x402-gateway
      - price-api

  relay:
    image: arcaidia-service:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE: packages/relay/src/entrypoint/main.ts
      RELAY_PORT: '8090'
    expose: ['8090']

  x402-gateway:
    image: arcaidia-service:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE: packages/x402-gateway/src/entrypoint/main.ts
      X402_GATEWAY_PORT: '8402'
      # Paid requests are forwarded to the relay over the compose network.
      INTELLIGENCE_UPSTREAM: http://relay:8090
    expose: ['8402']
    depends_on: [relay]

  house-solver:
    image: arcaidia-service:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE: packages/agent/src/entrypoint/main.ts
      SOLVER_QUOTE_PORT: '8787'
      # Inside the compose network the relay is reachable by service name, not by public URL.
      ARCAIDIA_TELEMETRY_URL: http://relay:8090
      TELEMETRY_ENABLED: 'true'
      SOLVER_DECISION_LOG_PATH: /tmp/solver-decisions.jsonl
      # WP-35: the House solver buys its market view through the paywall (HEDERA_* from .env).
      # Needs X402_PAY_TO in .env to be a different account from HEDERA_ACCOUNT_ID; until then set
      # HOUSE_INTELLIGENCE_URL=http://relay:8090 in .env to read the same view free.
      INTELLIGENCE_URL: ${HOUSE_INTELLIGENCE_URL:-http://x402-gateway:8402}
    expose: ['8787']
    depends_on: [relay, x402-gateway]

  settlement:
    image: arcaidia-service:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE: packages/settlement/src/entrypoint/main.ts
    depends_on: [relay]

  solver-b:
    profiles: [operators]
    image: arcaidia-service:latest
    restart: unless-stopped
    env_file: [.env.solver-b]
    environment:
      SERVICE: packages/agent/src/entrypoint/main.ts
      SOLVER_QUOTE_PORT: '8787'
      ARCAIDIA_TELEMETRY_URL: http://relay:8090
      TELEMETRY_ENABLED: 'true'
      SOLVER_DECISION_LOG_PATH: /tmp/solver-decisions.jsonl
    depends_on: [relay]

  solver-c:
    profiles: [operators]
    image: arcaidia-service:latest
    restart: unless-stopped
    env_file: [.env.solver-c]
    environment:
      SERVICE: packages/agent/src/entrypoint/main.ts
      SOLVER_QUOTE_PORT: '8787'
      ARCAIDIA_TELEMETRY_URL: http://relay:8090
      TELEMETRY_ENABLED: 'true'
      SOLVER_DECISION_LOG_PATH: /tmp/solver-decisions.jsonl
    depends_on: [relay]

  # Fourth operator (2026-09-14): the vault deployed through Earn (Sepolia only), moved here from
  # the owner's laptop so it stays online. Same image; its own keys in .env.solver-d.
  solver-d:
    profiles: [operators]
    image: arcaidia-service:latest
    restart: unless-stopped
    env_file: [.env.solver-d]
    environment:
      SERVICE: packages/agent/src/entrypoint/main.ts
      SOLVER_QUOTE_PORT: '8787'
      ARCAIDIA_TELEMETRY_URL: http://relay:8090
      TELEMETRY_ENABLED: 'true'
      SOLVER_DECISION_LOG_PATH: /tmp/solver-decisions.jsonl
    depends_on: [relay]

  loadgen:
    profiles: [loadgen]
    image: arcaidia-service:latest
    restart: unless-stopped
    env_file: [.env.loadgen]
    environment:
      SERVICE: packages/loadgen/src/entrypoint/main.ts
      LOADGEN_JOURNAL_PATH: /tmp/loadgen.jsonl
      LOADGEN_METRICS_PATH: /tmp/loadgen.metrics.json
    volumes:
      - ./loadgen.config.json:/app/loadgen.config.json:ro
    depends_on: [relay]

  # WP-34 (Line 1): the destination market's own two processes, from the market repo's image
  # (immaxkent/uniswap-v2, built and shipped by scripts/ops-deploy.sh BUILD=local). Config is
  # .env.market: the market wallet key (never Arcaidia's), the RPC URLs, the seed.
  price-api:
    image: arcaidia-market:latest
    restart: unless-stopped
    env_file: [.env.market]
    environment:
      SERVICE: bots/src/entrypoint/prices.ts
      PRICE_API_PORT: '8791'
      # Sharper candles than the once-a-minute default; the chart buckets samples anyway.
      PRICE_SAMPLE_SECONDS: '15'
      PRICE_SNAPSHOT: /data/price-history.json
    volumes:
      - market-data:/data
    expose: ['8791']

  market-bot:
    image: arcaidia-market:latest
    restart: unless-stopped
    env_file: [.env.market]
    environment:
      SERVICE: bots/src/entrypoint/market.ts
      MARKET_STATE: /data/reference-prices.json
    volumes:
      - market-data:/data

volumes:
  caddy-data:
  caddy-config:
  market-data:
